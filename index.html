<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario · Existencias y movimientos</title>
<style>
  :root {
    color-scheme: dark;
    --fondo: #16130F; --tarjeta: #241F1B; --campo: #1C1916; --borde: rgba(255,255,255,0.09); --borde2: rgba(255,255,255,0.16);
    --texto: #EEEAE5; --suave: #A9A39C; --azul: #2494C2; --oro: #D4A845; --verde: #4CC38A; --rojo: #E5604D;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
         padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  .contenedor { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; }
  header.tarjeta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; }
  h1 { margin: 0; font-size: 19px; }
  .estado { color: var(--suave); font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); }
  .punto.error { background: var(--rojo); }
  .btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--borde2); background: var(--campo); color: var(--texto); font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--azul); }
  .btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .metricas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .metrica { padding: 14px; }
  .metrica span { display: block; color: var(--suave); font-size: 12.5px; }
  .metrica strong { font-size: 22px; }
  .seccion { padding: 16px; }
  .pestanas { display: inline-flex; gap: 4px; padding: 4px; background: var(--campo); border: 1px solid var(--borde); border-radius: 11px; margin-bottom: 14px; }
  .pestana { border: 0; background: none; color: var(--suave); font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .pestana.activa { background: var(--azul); color: #fff; }
  .filtros { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
  .campo { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--borde2); background: var(--campo); color: var(--texto); font: inherit; }
  .campo.buscar { flex: 1 1 260px; }
  label.chk { display: inline-flex; gap: 8px; align-items: center; color: var(--suave); cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--azul); color: var(--azul); font-size: 12.5px; }
  .chip button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; }
  .tabla { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th { text-align: left; font-size: 12.5px; color: var(--suave); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: var(--tarjeta); }
  td { padding: 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tr.clic { cursor: pointer; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .codigo { font-family: Consolas, Menlo, monospace; font-size: 12px; color: var(--azul); font-weight: 700; }
  .suave { color: var(--suave); }
  .bajo { color: var(--rojo); font-weight: 700; }
  .ok { color: var(--verde); font-weight: 700; }
  .etq { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .t-entrada { color: var(--verde); } .t-salida { color: var(--rojo); } .t-ajuste { color: var(--oro); } .t-otro { color: var(--suave); }
  .mas { color: var(--verde); } .menos { color: var(--rojo); }
  .aviso { padding: 12px 14px; border-radius: 10px; border-left: 3px solid var(--rojo); background: rgba(229,96,77,0.1); white-space: pre-line; }
  .vacio { padding: 30px; text-align: center; color: var(--suave); }
  .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--suave); font-size: 12.5px; }
  @media (max-width: 700px) { .metricas { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="contenedor">
  <header class="tarjeta">
    <div>
      <h1>Inventario · Existencias y movimientos</h1>
      <div class="estado"><span class="punto" id="punto"></span><span id="estado">Cargando…</span></div>
    </div>
    <button class="btn" onclick="actualizar()">↻ Actualizar</button>
  </header>

  <section class="metricas" aria-label="Resumen">
    <div class="tarjeta metrica"><span>Ítems</span><strong id="m-items">—</strong></div>
    <div class="tarjeta metrica"><span>Unidades en existencia</span><strong id="m-unidades">—</strong></div>
    <div class="tarjeta metrica"><span>En alerta (bajo mínimo)</span><strong id="m-alertas" class="bajo">—</strong></div>
    <div class="tarjeta metrica"><span>Sin existencias</span><strong id="m-sin">—</strong></div>
  </section>

  <main class="tarjeta seccion">
    <div class="pestanas" role="tablist">
      <button class="pestana activa" id="tab-inv" onclick="verPestana('inv')">Existencias</button>
      <button class="pestana" id="tab-mov" onclick="verPestana('mov')">Movimientos</button>
    </div>

    <div id="aviso" class="aviso" hidden></div>

    <!-- EXISTENCIAS -->
    <div id="vista-inv">
      <div class="filtros">
        <input class="campo buscar" id="inv-q" type="search" placeholder="Buscar por código o nombre…" oninput="pintarInventario()">
        <label class="chk"><input type="checkbox" id="inv-alerta" onchange="pintarInventario()"> Solo en alerta</label>
      </div>
      <div class="tabla">
        <table>
          <thead><tr id="inv-cab"></tr></thead>
          <tbody id="inv-cuerpo"></tbody>
        </table>
      </div>
      <div class="pie"><span id="inv-conteo"></span><span>Toca un ítem para ver sus movimientos</span></div>
    </div>

    <!-- MOVIMIENTOS -->
    <div id="vista-mov" hidden>
      <div class="filtros">
        <span class="chip" id="mov-item-chip" hidden><span id="mov-item-txt"></span><button onclick="quitarItem()" aria-label="Quitar filtro">×</button></span>
        <input class="campo buscar" id="mov-q" type="search" placeholder="Buscar en ítem, nota o usuario…" oninput="buscarMovimientos()">
        <select class="campo" id="mov-tipo" onchange="cargarMovimientos(true)">
          <option value="">Todos los tipos</option>
          <option value="entrada">Entradas</option>
          <option value="salida">Salidas</option>
          <option value="ajuste">Ajustes</option>
        </select>
        <input class="campo" id="mov-desde" type="date" onchange="cargarMovimientos(true)" aria-label="Desde">
        <input class="campo" id="mov-hasta" type="date" onchange="cargarMovimientos(true)" aria-label="Hasta">
      </div>
      <div class="tabla">
        <table>
          <thead><tr><th>Fecha</th><th>Ítem</th><th>Tipo</th><th class="num">Cantidad</th><th>Usuario</th><th>Nota</th><th id="mov-cab-bodega">Bodega</th></tr></thead>
          <tbody id="mov-cuerpo"></tbody>
        </table>
      </div>
      <div class="pie"><span id="mov-conteo"></span><button class="btn" id="mov-mas" onclick="cargarMovimientos(false)" hidden>Cargar más</button></div>
    </div>
  </main>
</div>

<script>
  // Dirección de la API: vacío = la misma app (Pages Functions en /api)
  const API_BASE = '';
  // Solo si configuraste la variable API_KEY en Cloudflare Pages
  const API_KEY = '';
  const REFRESCO_MS = 20000; // cada cuánto se actualiza solo

  let inventario = [], modo = 'generico';
  let mov = { pagina: 0, filas: [], item: '' };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = n => Number(n || 0).toLocaleString('es-CR', { maximumFractionDigits: 2 });
  const fecha = f => {
    if (!f) return '—';
    const d = new Date(String(f).length <= 10 ? f + 'T00:00:00' : f);
    return isNaN(d) ? esc(f) : d.toLocaleDateString('es-CR', { day: '2-digit', month: 'short', year: 'numeric' }) +
      (String(f).length > 10 ? ' ' + d.toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' }) : '');
  };

  async function api(ruta, params = {}) {
    const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)).toString();
    const res = await fetch(API_BASE + ruta + (qs ? '?' + qs : ''), { headers: API_KEY ? { 'X-Api-Key': API_KEY } : {}, cache: 'no-store' });
    let data = null;
    try { data = await res.json(); } catch (e) { /* respuesta sin JSON */ }
    if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('El servidor respondió ' + res.status));
    return data;
  }

  function estado(ok, texto) {
    document.getElementById('punto').classList.toggle('error', !ok);
    document.getElementById('estado').textContent = texto;
    const av = document.getElementById('aviso');
    av.hidden = ok;
    if (!ok) av.textContent = texto + '\n\nRevisa que la base D1 esté conectada con el nombre DB y que lib/config.js tenga los nombres correctos de tablas y columnas (abre /api/esquema para verlos).';
  }

  // ---------- Existencias ----------
  async function cargarInventario() {
    const data = await api('/api/inventario');
    inventario = data.items; modo = data.modo;
    document.getElementById('m-items').textContent = num(data.resumen.items);
    document.getElementById('m-unidades').textContent = num(data.resumen.unidades);
    document.getElementById('m-alertas').textContent = num(data.resumen.alertas);
    document.getElementById('m-sin').textContent = num(data.resumen.sinStock);
    pintarInventario();
  }

  function pintarInventario() {
    const q = document.getElementById('inv-q').value.trim().toLowerCase();
    const soloAlerta = document.getElementById('inv-alerta').checked;
    const filas = inventario.filter(i => (!q || (i.clave + ' ' + i.nombre).toLowerCase().includes(q)) && (!soloAlerta || i.alerta));
    const conBodegas = modo === 'marc_erp';
    document.getElementById('inv-cab').innerHTML = '<th>Código</th><th>Ítem</th><th>Unidad</th><th class="num">Existencia</th><th class="num">Mínimo</th>' +
      (conBodegas ? '<th>Por bodega</th>' : '') + '<th class="num">Movimientos</th><th>Último movimiento</th>';
    document.getElementById('inv-cuerpo').innerHTML = filas.map(i => `
      <tr class="clic" data-clave="${esc(i.clave)}" data-nombre="${esc(i.nombre)}" onclick="verMovimientosDe(this.dataset.clave, this.dataset.nombre)">
        <td class="codigo">${esc(i.clave)}</td>
        <td>${esc(i.nombre)}</td>
        <td class="suave">${esc(i.unidad || '—')}</td>
        <td class="num ${i.alerta ? 'bajo' : 'ok'}">${num(i.stock)}</td>
        <td class="num suave">${i.minimo ? num(i.minimo) : '—'}</td>
        ${conBodegas ? `<td class="suave">${Object.entries(i.bodegas || {}).filter(([, c]) => c).map(([b, c]) => esc(b) + ': ' + num(c)).join(' · ') || '—'}</td>` : ''}
        <td class="num suave">${num(i.movimientos)}</td>
        <td class="suave">${fecha(i.ultimo)}</td>
      </tr>`).join('') || `<tr><td colspan="8" class="vacio">${inventario.length ? 'Ningún ítem coincide con la búsqueda.' : 'Todavía no hay movimientos registrados.'}</td></tr>`;
    document.getElementById('inv-conteo').textContent = filas.length === inventario.length ? `${filas.length} ítems` : `Mostrando ${filas.length} de ${inventario.length} ítems`;
  }

  // ---------- Movimientos ----------
  async function cargarMovimientos(reiniciar) {
    if (reiniciar) { mov.pagina = 0; mov.filas = []; } else mov.pagina++;
    const data = await api('/api/movimientos', {
      item: mov.item, tipo: document.getElementById('mov-tipo').value, q: document.getElementById('mov-q').value.trim(),
      desde: document.getElementById('mov-desde').value, hasta: document.getElementById('mov-hasta').value,
      limite: 100, pagina: mov.pagina,
    }).catch(err => { estado(false, err.message); return null; });
    if (!data) return;
    mov.filas = reiniciar ? data.movimientos : mov.filas.concat(data.movimientos);
    document.getElementById('mov-mas').hidden = !data.hayMas;
    pintarMovimientos();
  }

  function pintarMovimientos() {
    const conBodega = mov.filas.some(m => m.bodega);
    document.getElementById('mov-cab-bodega').hidden = !conBodega;
    const etiqueta = { entrada: 'Entrada', salida: 'Salida', ajuste: 'Ajuste', otro: 'Otro' };
    document.getElementById('mov-cuerpo').innerHTML = mov.filas.map(m => `
      <tr>
        <td class="suave" style="white-space:nowrap">${fecha(m.fecha)}</td>
        <td><span class="codigo">${esc(m.clave)}</span>${m.nombre && m.nombre !== m.clave ? '<br>' + esc(m.nombre) : ''}</td>
        <td><span class="etq t-${m.tipo}" title="${esc(m.tipoOriginal)}">${etiqueta[m.tipo] || esc(m.tipoOriginal)}</span></td>
        <td class="num ${m.cantidad > 0 ? 'mas' : m.cantidad < 0 ? 'menos' : ''}">${m.cantidad > 0 ? '+' : ''}${num(m.cantidad)} ${esc(m.unidad)}</td>
        <td>${esc(m.usuario || '—')}</td>
        <td class="suave">${esc(m.nota || '')}</td>
        ${conBodega ? `<td class="suave">${esc(m.bodega)}</td>` : ''}
      </tr>`).join('') || '<tr><td colspan="7" class="vacio">No hay movimientos con estos filtros.</td></tr>';
    document.getElementById('mov-conteo').textContent = `${mov.filas.length} movimientos`;
  }

  let tBusqueda = null;
  function buscarMovimientos() { clearTimeout(tBusqueda); tBusqueda = setTimeout(() => cargarMovimientos(true), 350); }

  function verMovimientosDe(clave, nombre) {
    mov.item = clave;
    document.getElementById('mov-item-txt').textContent = nombre && nombre !== clave ? `${clave} · ${nombre}` : clave;
    document.getElementById('mov-item-chip').hidden = false;
    verPestana('mov');
    cargarMovimientos(true);
  }
  function quitarItem() {
    mov.item = '';
    document.getElementById('mov-item-chip').hidden = true;
    cargarMovimientos(true);
  }

  function verPestana(cual) {
    document.getElementById('vista-inv').hidden = cual !== 'inv';
    document.getElementById('vista-mov').hidden = cual !== 'mov';
    document.getElementById('tab-inv').classList.toggle('activa', cual === 'inv');
    document.getElementById('tab-mov').classList.toggle('activa', cual === 'mov');
    if (cual === 'mov' && !mov.filas.length) cargarMovimientos(true);
  }

  // ---------- Actualización automática ----------
  async function actualizar() {
    try {
      await cargarInventario();
      if (!document.getElementById('vista-mov').hidden && mov.pagina === 0) await cargarMovimientos(true);
      estado(true, 'Actualizado a las ' + new Date().toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    } catch (err) {
      estado(false, err.message);
    }
  }
  actualizar();
  setInterval(() => { if (!document.hidden) actualizar(); }, REFRESCO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) actualizar(); });
</script>
</body>
</html>
